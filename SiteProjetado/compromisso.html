<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetLink</title>
  <link rel="stylesheet" href="style.css">
  <script src="js.js" defer></script>
</head>

<body>
  <header>
    <h1>PetLink</h1>
    <nav>
      <a href="catalogo.html">Catálogo</a>
      <a href="index.html">Sair</a>
    </nav>
  </header>

  <main>
    <form class="caixa" id="caixa" action="confirmacao.html">
      <h2>Agendar compromisso</h2>
      <p>Pet escolhido: <b>Caramelo (Cachorro)</b></p>

      <label for="data">Data</label>
      <input id="data" type="date" required>

      <label for="horario">Horário</label>
      <select id="horario">
        <option>09:00</option>
        <option>14:00</option>
        <option>16:00</option>
      </select>

      <button class="botao" type="submit">Agendar</button>
      <a class="botao claro" href="catalogo.html">Cancelar</a>
    </form>
  </main>
</body>

</html>
